<title>采购清单 · W1-11-02</title>
<style>
*{box-sizing:border-box;-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;background:#fff;color:#111;
 font:15px/1.55 "PingFang SC","Hiragino Sans GB",sans-serif;}
.stickytop{position:-webkit-sticky;position:sticky;top:0;z-index:9;
 background:#fff;border-bottom:1px solid #e6e6e2;}
.sitenav{display:flex;padding:0 4px;border-bottom:1px solid #f0f0ec;}
.sitenav a{flex:1;text-align:center;font-size:13px;padding:11px 2px;
 color:#666;text-decoration:none;font-weight:500;white-space:nowrap;}
.sitenav a.on{color:#111;font-weight:700;box-shadow:inset 0 -2px 0 #111;}
.sitenav a.hot{color:#b5342a;font-weight:600;}
.bar{display:flex;align-items:center;gap:8px;padding:9px 10px;}
.bar .p{flex:1;font-size:13px;color:#666;}
.bar .p b{color:#b5342a;font-size:16px;}
.bar button{font-family:inherit;font-size:13px;padding:8px 11px;border-radius:9px;
 border:1px solid #e0e0dc;background:#fff;color:#444;font-weight:600;
 -webkit-tap-highlight-color:transparent;}
.bar button.pri{background:#111;color:#fff;border-color:#111;}
h2{font-size:13px;color:#999;font-weight:600;letter-spacing:1px;
 margin:18px 0 6px;padding:0 16px;display:flex;justify-content:space-between;}
h2 span{font-weight:400;color:#c0c0bc;}
.grp{padding:0 8px;}
.it{display:flex;align-items:center;gap:10px;padding:11px 8px;
 border-bottom:1px solid #f2f2ee;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.it input{width:20px;height:20px;flex:0 0 auto;accent-color:#111;}
.it .nm{flex:1;font-size:15.5px;}
.it .q{font-size:14px;color:#b5342a;font-weight:600;white-space:nowrap;}
.it .d{font-size:12px;color:#bbb;white-space:nowrap;}
.it input:checked ~ .nm{text-decoration:line-through;color:#c8c8c4;}
.it input:checked ~ .q{text-decoration:line-through;color:#ddd;}
.foot{text-align:center;color:#d0d0cc;font-size:11.5px;padding:26px 0 20px;}
#toast{display:none;position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);
 background:rgba(0,0,0,.86);color:#fff;padding:14px 22px;border-radius:12px;
 font-size:15.5px;z-index:300;pointer-events:none;max-width:80%;text-align:center;}
.bighint{background:#fdecea;color:#c0392b;border:2px solid #c0392b;border-radius:12px;
 padding:14px 16px;font-size:17px;font-weight:800;text-align:center;line-height:1.5;}
#mask{display:none;position:fixed;left:0;right:0;top:0;bottom:0;z-index:200;background:rgba(0,0,0,.45);}
#mask.on{display:block;}
#dlg{position:fixed;left:0;right:0;bottom:0;z-index:201;display:none;background:#fff;
 border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;
 padding:16px 16px calc(20px + env(safe-area-inset-bottom));}
#dlg.on{display:block;}
#dlg h3{margin:0 0 4px;font-size:18px;}
#dlg .sub{font-size:13px;color:#999;margin-bottom:12px;}
#dlg .acts{display:flex;gap:8px;margin-top:16px;}
#dlg .acts button{flex:1;font-size:15px;padding:13px;border-radius:11px;border:none;font-weight:600;}
#dlg #closeBtn{background:#f2f2ee;color:#555;}
@media print{
 .stickytop,#mask,#dlg,.foot{display:none !important;}
 .it{border-bottom:1px solid #ddd;page-break-inside:avoid;}
 h2{page-break-after:avoid;}
 body{font-size:12pt;}
 .it input{display:none;}
 .it::before{content:"☐ ";font-size:14pt;}
}
</style></head><body>

</div>

<h2>肉禽<span>9 项</span></h2><div class="grp"><label class="it"><input type="checkbox" data-i="0"><span class="nm">三黄鸡</span><span class="q">900g</span><span class="d">周五</span></label><label class="it"><input type="checkbox" data-i="1"><span class="nm">牛腩</span><span class="q">700g</span><span class="d">周日</span></label><label class="it"><input type="checkbox" data-i="2"><span class="nm">猪排骨</span><span class="q">1400g</span><span class="d">周三、周四</span></label><label class="it"><input type="checkbox" data-i="3"><span class="nm">猪瘦肉</span><span class="q">400g</span><span class="d">周日</span></label><label class="it"><input type="checkbox" data-i="4"><span class="nm">猪肉</span><span class="q">250g</span><span class="d">周五</span></label><label class="it"><input type="checkbox" data-i="5"><span class="nm">猪肉末</span><span class="q">800g</span><span class="d">周一、周四</span></label><label class="it"><input type="checkbox" data-i="6"><span class="nm">猪骨</span><span class="q">600g</span><span class="d">周四</span></label><label class="it"><input type="checkbox" data-i="7"><span class="nm">鸡</span><span class="q">800g</span><span class="d">周日</span></label><label class="it"><input type="checkbox" data-i="8"><span class="nm">鸡翅中</span><span class="q">800g</span><span class="d">周三</span></label></div><h2>水产<span>7 项</span></h2><div class="grp"><label class="it"><input type="checkbox" data-i="9"><span class="nm">干贝</span><span class="q">50g</span><span class="d">周日</span></label><label class="it"><input type="checkbox" data-i="10"><span class="nm">杏鲍菇</span><span class="q">300g</span><span class="d">周三</span></label><label class="it"><input type="checkbox" data-i="11"><span class="nm">沙虾</span><span class="q">500g</span><span class="d">周一</span></label><label class="it"><input type="checkbox" data-i="12"><span class="nm">虾仁</span><span class="q">300g</span><span class="d">周六</span></label><label class="it"><input type="checkbox" data-i="13"><span class="nm">虾皮</span><span class="q">50g</span><span class="d">周二、周日</span></label><label class="it"><input type="checkbox" data-i="14"><span class="nm">鲈鱼</span><span class="q">600g</span><span class="d">周二</span></label><label class="it"><input type="checkbox" data-i="15"><span class="nm">鳕鱼</span><span class="q">700g</span><span class="d">周六</span></label></div><h2>蛋豆<span>4 项</span></h2><div class="grp"><label class="it"><input type="checkbox" data-i="16"><span class="nm">北豆腐</span><span class="q">700g</span><span class="d">周五</span></label><label class="it"><input type="checkbox" data-i="17"><span class="nm">嫩豆腐</span><span class="q">500g</span><span class="d">周二</span></label><label class="it"><input type="checkbox" data-i="18"><span class="nm">老豆腐</span><span class="q">1200g</span><span class="d">周三、周六、周日</span></label><label class="it"><input type="checkbox" data-i="19"><span class="nm">鸡蛋</span><span class="q">1350个</span><span class="d">周一、周二、周四、周六</span></label></div><h2>乳品主食<span>3 项</span></h2><div class="grp"><label class="it"><input type="checkbox" data-i="20"><span class="nm">淡奶油</span><span class="q">1瓶</span><span class="d">周三、周六</span></label><label class="it"><input type="checkbox" data-i="21"><span class="nm">牛奶</span><span class="q">1瓶</span><span class="d">周六</span></label><label class="it"><input type="checkbox" data-i="22"><span class="nm">粉丝</span><span class="q">100g</span><span class="d">周五</span></label></div><h2>蔬菜<span>17 项</span></h2><div class="grp"><label class="it"><input type="checkbox" data-i="23"><span class="nm">丝瓜</span><span class="q">500g</span><span class="d">周五</span></label><label class="it"><input type="checkbox" data-i="24"><span class="nm">冬瓜</span><span class="q">1100g</span><span class="d">周二、周日</span></label><label class="it"><input type="checkbox" data-i="25"><span class="nm">梅干菜</span><span class="q">100g</span><span class="d">周四</span></label><label class="it"><input type="checkbox" data-i="26"><span class="nm">油麦菜</span><span class="q">700g</span><span class="d">周二</span></label><label class="it"><input type="checkbox" data-i="27"><span class="nm">玉米</span><span class="q">400g</span><span class="d">周四</span></label><label class="it"><input type="checkbox" data-i="28"><span class="nm">生菜</span><span class="q">700g</span><span class="d">周五</span></label><label class="it"><input type="checkbox" data-i="29"><span class="nm">番茄</span><span class="q">700g</span><span class="d">周三</span></label><label class="it"><input type="checkbox" data-i="30"><span class="nm">白菜</span><span class="q">250g</span><span class="d">周五</span></label><label class="it"><input type="checkbox" data-i="31"><span class="nm">白萝卜</span><span class="q">1100g</span><span class="d">周四、周日</span></label><label class="it"><input type="checkbox" data-i="32"><span class="nm">白蘑菇</span><span class="q">400g</span><span class="d">周六</span></label><label class="it"><input type="checkbox" data-i="33"><span class="nm">胡萝卜</span><span class="q">250g</span><span class="d">周四</span></label><label class="it"><input type="checkbox" data-i="34"><span class="nm">芥兰</span><span class="q">600g</span><span class="d">周一</span></label><label class="it"><input type="checkbox" data-i="35"><span class="nm">菜心</span><span class="q">600g</span><span class="d">周六</span></label><label class="it"><input type="checkbox" data-i="36"><span class="nm">西兰花</span><span class="q">600g</span><span class="d">周三</span></label><label class="it"><input type="checkbox" data-i="37"><span class="nm">通菜</span><span class="q">1400g</span><span class="d">周四、周日</span></label><label class="it"><input type="checkbox" data-i="38"><span class="nm">金针菇</span><span class="q">300g</span><span class="d">周五</span></label><label class="it"><input type="checkbox" data-i="39"><span class="nm">香菇</span><span class="q">250g</span><span class="d">周二、周五</span></label></div><h2>干货<span>2 项</span></h2><div class="grp"><label class="it"><input type="checkbox" data-i="40"><span class="nm">紫菜</span><span class="q">50g</span><span class="d">周一</span></label><label class="it"><input type="checkbox" data-i="41"><span class="nm">菜脯</span><span class="q">200g</span><span class="d">周一、周四</span></label></div>

<div class="foot">菜谱目录 · W1-11-02</div>

<div id="mask"></div>
<div id="dlg"></div>
<div id="toast"></div>

<script>
(function(){
 try{
  var KEY = "rb_shop_W1-11-02";
  var boxes = [].slice.call(document.querySelectorAll(".it input"));
  var doneEl = document.getElementById("done");

  function load(){
    try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; }
  }
  function save(){
    var m = {};
    boxes.forEach(function(b){ if(b.checked) m[b.getAttribute("data-i")]=1; });
    localStorage.setItem(KEY, JSON.stringify(m));
  }
  function sync(){
    var n = boxes.filter(function(b){ return b.checked; }).length;
    doneEl.textContent = n;
  }

  var st = load();
  boxes.forEach(function(b){
    if(st[b.getAttribute("data-i")]) b.checked = true;
    b.onchange = function(){ save(); sync(); };
  });
  sync();

  document.getElementById("clear").onclick = function(){
    boxes.forEach(function(b){ b.checked = false; });
    save(); sync();
  };

  // ===== 保存清单（进「我的单」，与菜谱目录打通）=====
  function pad(n){ return ("0"+n).slice(-2); }
  function todayStr(){ var d=new Date(); return pad(d.getMonth()+1)+"/"+pad(d.getDate()); }
  function loadLists(){ try{ return JSON.parse(localStorage.getItem("rb_lists")||"[]"); }catch(e){ return []; } }
  function loadTrash(){ try{ return JSON.parse(localStorage.getItem("rb_trash")||"[]"); }catch(e){ return []; } }

  document.getElementById("save").onclick = function(){
    var items = [].slice.call(document.querySelectorAll(".it")).map(function(el){
      return { n: el.querySelector(".nm").textContent, q: el.querySelector(".q").textContent };
    });
    var base = todayStr(), used = {}, i = 1;
    loadLists().concat(loadTrash()).forEach(function(x){
      var nm = (x.name||"");
      if(nm.indexOf(base)===0){ var m = nm.match(/-([0-9]+)$/); used[m ? +m[1] : 1] = 1; }
    });
    while(used[i]) i++;
    var nm = base + "-" + i;
    var d = new Date();
    var ls = loadLists();
    ls.unshift({
      id: d.getTime(), name: nm,
      date: d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),
      items: items, dishes: [], from: "本周菜单 W1-11-02"
    });
    localStorage.setItem("rb_lists", JSON.stringify(ls));
    var t = document.getElementById("toast");
    t.textContent = "已保存：" + nm;
    t.style.display = "block";
    setTimeout(function(){ t.style.display = "none"; }, 1500);
  };

  // ===== 存为图片 =====
  var mask = document.getElementById("mask"), dlg = document.getElementById("dlg");
  function close(){ dlg.classList.remove("on"); mask.classList.remove("on"); }
  mask.onclick = close;

  function wrap(ctx, text, maxW){
    var lines=[], line="";
    for(var i=0;i<text.length;i++){
      var ch=text.charAt(i);
      if(ctx.measureText(line+ch).width > maxW && line){ lines.push(line); line=ch; }
      else line+=ch;
    }
    if(line) lines.push(line);
    return lines;
  }

  document.getElementById("img").onclick = function(){
    var items = [].slice.call(document.querySelectorAll(".it")).map(function(el){
      return {
        n: el.querySelector(".nm").textContent,
        q: el.querySelector(".q").textContent,
        d: el.querySelector(".d").textContent,
        on: el.querySelector("input").checked
      };
    });

    var W=750, pad=44, LH=42;
    var H = 150 + items.length*LH + 90;
    var c = document.createElement("canvas"); c.width=W; c.height=H;
    var x = c.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,W,H);

    x.fillStyle="#111"; x.font="bold 40px -apple-system,'PingFang SC',sans-serif";
    x.fillText("采购清单", pad, 74);
    x.fillStyle="#999"; x.font="24px -apple-system,'PingFang SC',sans-serif";
    x.fillText("W1-11-02 · 共 " + items.length + " 项 · 已买 " + items.filter(function(i){return i.on;}).length, pad, 112);
    x.strokeStyle="#e6e6e2"; x.lineWidth=2;
    x.beginPath(); x.moveTo(pad,132); x.lineTo(W-pad,132); x.stroke();

    var y = 150 + 30;
    items.forEach(function(it){
      x.fillStyle = it.on ? "#c8c8c4" : "#222";
      x.font = "28px -apple-system,'PingFang SC',sans-serif";
      x.fillText((it.on ? "☑ " : "☐ ") + it.n, pad, y);
      x.textAlign = "right";
      x.fillStyle = it.on ? "#e2e2de" : "#b5342a";
      x.font = "bold 28px -apple-system,'PingFang SC',sans-serif";
      x.fillText(it.q, W-pad, y);
      x.textAlign = "left";
      y += LH;
    });

    x.fillStyle="#cfcfca"; x.font="20px -apple-system,'PingFang SC',sans-serif";
    x.fillText("菜谱目录 · W1-11-02", pad, H-34);

    var data = c.toDataURL("image/png");
    dlg.innerHTML = "<h3>采购清单图片</h3><div class='bighint'>长按下面这张图 → 存储到照片</div>"+
      "<img src='"+data+"' style='width:100%;border:1px solid #eee;border-radius:10px'>"+
      "<div class='acts'><button id='closeBtn'>关闭</button></div>";
    dlg.classList.add("on"); mask.classList.add("on");
    document.getElementById("closeBtn").onclick = close;
  };
 }catch(err){ if(window.console) console.log("shop err:", err.message); }
})();
</script>
</body></html>
