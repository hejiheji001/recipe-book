<style>
*{box-sizing:border-box;-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;background:#fff;color:#111;
 font:15px/1.55 "PingFang SC","Hiragino Sans GB",sans-serif;}

.stickytop{position:-webkit-sticky;position:sticky;top:0;z-index:20;
 background:#fff;border-bottom:1px solid #e6e6e2;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.sitenav{display:flex;padding:0 4px;border-bottom:1px solid #f0f0ec;}
.sitenav a{flex:1;display:flex;align-items:center;justify-content:center;

.sitenav a.on{color:#111;font-weight:700;box-shadow:inset 0 -2px 0 #111;}
.sitenav a.hot{color:#b5342a;font-weight:600;}

.bar{display:flex;align-items:center;gap:5px;padding:8px 10px;}
.bar .p{flex:1 1 auto;font-size:13px;color:#666;line-height:1.25;}

.bar button.pri{background:#111;color:#fff;border-color:#111;}

.catbar{display:flex;gap:6px;overflow-x:auto;padding:0 10px 9px;

section.cat{display:none;}

h2{font-size:16px;margin:0;padding:13px 16px 12px;background:#f4f4f1;

h2 .gh input{width:19px;height:19px;accent-color:#111;}

.grp{padding:0 8px;}
.it{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 18px;
 border-bottom:1px solid #f4f4f0;cursor:pointer;
 -webkit-tap-highlight-color:transparent;}
.it input{width:19px;height:19px;flex:0 0 auto;accent-color:#111;}
.it .nm{flex:1;font-size:15px;}

.it .d{font-size:11.5px;color:#b8b8b2;white-space:nowrap;}
.it input:checked ~ .nm{text-decoration:line-through;color:#c8c8c4;}
.it input:checked ~ .q{text-decoration:line-through;color:#e0e0dc;}

#mask{display:none;position:fixed;left:0;right:0;top:0;bottom:0;z-index:200;
 background:rgba(0,0,0,.45);}
#mask.on{display:block;}
#dlg{position:fixed;left:0;right:0;bottom:0;z-index:201;display:none;
 background:#fff;border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;
 padding:16px 16px calc(20px + env(safe-area-inset-bottom));}
#dlg.on{display:block;}
#dlg h3{margin:0 0 4px;font-size:18px;}
#dlg .acts{display:flex;gap:8px;margin-top:14px;}
#dlg .acts button{flex:1;font-size:15px;padding:13px;border-radius:11px;border:none;font-weight:600;}
#dlg #closeBtn{background:#f2f2ee;color:#555;}
.bighint{background:#fdecea;color:#c0392b;border:2px solid #c0392b;border-radius:12px;
 padding:14px 16px;font-size:17px;font-weight:800;text-align:center;line-height:1.5;}
#toast{display:none;position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);
 background:rgba(0,0,0,.86);color:#fff;padding:14px 22px;border-radius:12px;
 font-size:15.5px;z-index:300;pointer-events:none;max-width:80%;text-align:center;}

body{min-height:100vh;display:flex;flex-direction:column;}
.foot{flex:1 0 auto;height:70px;}
.bottombar{position:-webkit-sticky;position:sticky;bottom:0;z-index:30;display:flex;gap:6px;
 padding:8px 10px calc(8px + env(safe-area-inset-bottom));
 background:#fff;border-top:1px solid #e6e6e2;box-shadow:0 -3px 12px rgba(0,0,0,.07);}
.bottombar a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:600;
 padding:10px 0;border-radius:9px;background:#fff;color:#444;border:1px solid #e0e0dc;}

@media print{
  .stickytop,.foot{display:none !important;}
  .it{border-bottom:1px solid #ddd;page-break-inside:avoid;}

  body{font-size:12pt;}
  .it input{display:none !important;}
  .it::before{content:"☐";font-size:13pt;margin-right:6px;}
}

bel class='it'><input type='checkbox' data-i='22' data-g='3'><span class='nm'>粉丝</span><span class='q'>100g</span><span class='d'>周五</span></label></div></section><section class='cat' data-g='4'><h2><label class='gh'><input type='checkbox' class='gc' data-g='4'><span>蔬菜</span></label><em>17 项</em></h2><div class='grp'><label class='it'><input type='checkbox' data-i='23' data-g='4'><span class='nm'>丝瓜</span><span class='q'>500g</span><span class='d'>周五</span></label><label class='it'><input type='checkbox' data-i='24' data-g='4'><span class='nm'>冬瓜</span><span class='q'>1100g</span><span class='d'>周二、周日</span></label><label class='it'><input type='checkbox' data-i='25' data-g='4'><span class='nm'>梅干菜</span><span class='q'>100g</span><span class='d'>周四</span></label><label class='it'><input type='checkbox' data-i='26' data-g='4'><span class='nm'>油麦菜</span><span class='q'>700g</span><span class='d'>周二</span></label><label class='it'><input type='checkbox' data-i='27' data-g='4'><span class='nm'>玉米</span><span class='q'>400g</span><span class='d'>周四</span></label><label class='it'><input type='checkbox' data-i='28' data-g='4'><span class='nm'>生菜</span><span class='q'>700g</span><span class='d'>周五</span></label><label class='it'><input type='checkbox' data-i='29' data-g='4'><span class='nm'>番茄</span><span class='q'>700g</span><span class='d'>周三</span></label><label class='it'><input type='checkbox' data-i='30' data-g='4'><span class='nm'>白菜</span><span class='q'>250g</span><span class='d'>周五</span></label><label class='it'><input type='checkbox' data-i='31' data-g='4'><span class='nm'>白萝卜</span><span class='q'>1100g</span><span class='d'>周四、周日</span></label><label class='it'><input type='checkbox' data-i='32' data-g='4'><span class='nm'>白蘑菇</span><span class='q'>400g</span><span class='d'>周六</span></label><label class='it'><input type='checkbox' data-i='33' data-g='4'><span class='nm'>胡萝卜</span><span class='q'>250g</span><span class='d'>周四</span></label><label class='it'><input type='checkbox' data-i='34' data-g='4'><span class='nm'>芥兰</span><span class='q'>600g</span><span class='d'>周一</span></label><label class='it'><input type='checkbox' data-i='35' data-g='4'><span class='nm'>菜心</span><span class='q'>600g</span><span class='d'>周六</span></label><label class='it'><input type='checkbox' data-i='36' data-g='4'><span class='nm'>西兰花</span><span class='q'>600g</span><span class='d'>周三</span></label><label class='it'><input type='checkbox' data-i='37' data-g='4'><span class='nm'>通菜</span><span class='q'>1400g</span><span class='d'>周四、周日</span></label><label class='it'><input type='checkbox' data-i='38' data-g='4'><span class='nm'>金针菇</span><span class='q'>300g</span><span class='d'>周五</span></label><label class='it'><input type='checkbox' data-i='39' data-g='4'><span class='nm'>香菇</span><span class='q'>250g</span><span class='d'>周二、周五</span></label></div></section><section class='cat' data-g='5'><h2><label class='gh'><input type='checkbox' class='gc' data-g='5'><span>干货</span></label><em>2 项</em></h2><div class='grp'><label class='it'><input type='checkbox' data-i='40' data-g='5'><span class='nm'>紫菜</span><span class='q'>50g</span><span class='d'>周一</span></label><label class='it'><input type='checkbox' data-i='41' data-g='5'><span class='nm'>菜脯</span><span class='q'>200g</span><span class='d'>周一、周四</span></label></div></section>

<div id="dlg"></div>
<div id="toast"></div>

<script>
(function(){
 try{
  var KEY = "rb_shop_W1-11-02";
  var boxes = [].slice.call(document.querySelectorAll(".it input"));
  var doneEl = document.getElementById("done");

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
  function save(){ var m={}; boxes.forEach(function(b){ if(b.checked) m[b.getAttribute("data-i")]=1; });
    localStorage.setItem(KEY, JSON.stringify(m)); }
  function sync(){ doneEl.textContent = boxes.filter(function(b){ return b.checked; }).length; }

  function syncGroup(g){
    var bs = [].slice.call(document.querySelectorAll('.it input[data-g="'+g+'"]'));
    var c = document.querySelector('.gc[data-g="'+g+'"]');
    if(!c || !bs.length) return;
    var n = bs.filter(function(b){ return b.checked; }).length;
    c.checked = (n === bs.length);
    c.indeterminate = (n>0 && n<bs.length);
  }
  function syncAllGroups(){ [].slice.call(document.querySelectorAll(".gc")).forEach(function(c){ syncGroup(c.getAttribute("data-g")); }); }

  var st = load();
  boxes.forEach(function(b){
    if(st[b.getAttribute("data-i")]) b.checked = true;
    b.onchange = function(){ save(); sync(); syncGroup(b.getAttribute("data-g")); };
  });
  sync(); syncAllGroups();

  [].slice.call(document.querySelectorAll(".gc")).forEach(function(c){
    c.onclick = function(ev){
      ev.stopPropagation();
      var g = c.getAttribute("data-g");
      document.querySelectorAll('.it input[data-g="'+g+'"]').forEach(function(b){ b.checked = c.checked; });
      save(); sync(); syncGroup(g);
    };
  });

  document.getElementById("all").onclick = function(){
    var all = boxes.every(function(b){ return b.checked; });
    boxes.forEach(function(b){ b.checked = !all; });
    save(); sync(); syncAllGroups();
  };
  document.getElementById("clear").onclick = function(){
    boxes.forEach(function(b){ b.checked = false; });
    save(); sync(); syncAllGroups();
  };

  // 分类筛选（多选）
  var pickedCats = {};
  function applyCats(){
    var all = Object.keys(pickedCats).length === 0;
    [].slice.call(document.querySelectorAll("section.cat")).forEach(function(s){
      s.classList.toggle("on", all || pickedCats[s.getAttribute("data-g")] === 1);
    });
    var allChip = document.querySelector('.cf[data-g=""]');
    if(allChip) allChip.classList.toggle("on", all);
  }
  [].slice.call(document.querySelectorAll(".cf")).forEach(function(c){
    c.onclick = function(){
      var g = c.getAttribute("data-g");
      if(g === ""){
        pickedCats = {};
        boxes.forEach(function(b){ b.checked = false; });
      }
      else if(pickedCats[g]){ delete pickedCats[g]; }
      else { pickedCats[g] = 1; }
      // 选中分类 → 该分类下全部勾上；取消 → 全部取消
      [].slice.call(document.querySelectorAll("section.cat")).forEach(function(sec){
        var gi2 = sec.getAttribute("data-g");
        var on = (g === "") ? false : (pickedCats[gi2] === 1);
        if(g === "") return;
        [].slice.call(sec.querySelectorAll(".it input")).forEach(function(b){ b.checked = on; });
        syncGroup(gi2);
      });
      save(); sync();
      [].slice.call(document.querySelectorAll(".cf")).forEach(function(x){
        var gg = x.getAttribute("data-g");
        if(gg !== "") x.classList.toggle("on", pickedCats[gg] === 1);
      });
      applyCats();
    };
  });
  applyCats();

  function pad(n){ return ("0"+n).slice(-2); }
  function todayStr(){ var d=new Date(); return pad(d.getMonth()+1)+"/"+pad(d.getDate()); }
  function loadLists(){ try{ return JSON.parse(localStorage.getItem("rb_lists")||"[]"); }catch(e){ return []; } }
  function loadTrash(){ try{ return JSON.parse(localStorage.getItem("rb_trash")||"[]"); }catch(e){ return []; } }

  function toast(msg){
    var t=document.getElementById("toast");
    t.textContent=msg; t.style.display="block";
    setTimeout(function(){ t.style.display="none"; },1500);
  }

  document.getElementById("save").onclick = function(){
    var items = [].slice.call(document.querySelectorAll(".it")).map(function(el){
      return { n: el.querySelector(".nm").textContent, q: el.querySelector(".q").textContent };
    });
    var base = todayStr(), used = {}, i = 1;
    loadLists().concat(loadTrash()).forEach(function(x){
      var nm=(x.name||""); if(nm.indexOf(base)===0){ var m=nm.match(/-([0-9]+)$/); used[m?+m[1]:1]=1; }
    });
    while(used[i]) i++;
    var nm = base + "-" + i, d = new Date(), ls = loadLists();
    ls.unshift({ id:d.getTime(), name:nm,
      date:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),
      items:items, dishes:[], from:"本周菜单 W1-11-02" });
    localStorage.setItem("rb_lists", JSON.stringify(ls));
    toast("已保存：" + nm);
  };

  var mask=document.getElementById("mask"), dlg=document.getElementById("dlg");
  mask.onclick=function(){ dlg.classList.remove("on"); mask.classList.remove("on"); };

  function wrap(ctx,text,maxW){
    var out=[],line="";
    for(var i=0;i<text.length;i++){
      var ch=text.charAt(i);
      if(ctx.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch;
    }
    if(line) out.push(line);
    return out;
  }

  document.getElementById("img").onclick = function(){
    // 按分类收集（保留分组）
    var groups = [];
    [].slice.call(document.querySelectorAll("section.cat")).forEach(function(sec){
      var h = sec.querySelector("h2 .gh span");
      var cat = h ? h.textContent : "其他";
      var arr = [];
      [].slice.call(sec.querySelectorAll(".it")).forEach(function(el){
        arr.push({ n: el.querySelector(".nm").textContent,
                    q: el.querySelector(".q").textContent,
                    on: el.querySelector("input").checked });
      });
      groups.push({ cat: cat, items: arr });
    });

    // 有勾选就只导出勾选的分类/条目
    var any = false;
    groups.forEach(function(g){ if(g.items.some(function(i){return i.on;})) any = true; });

    var render = [];
    groups.forEach(function(g){
      var items = any ? g.items.filter(function(i){ return i.on; }) : g.items;
      if(items.length) render.push({ cat: g.cat, items: items });
    });

    var total = render.reduce(function(s,g){ return s + g.items.length; }, 0);

    var W = 750, pad = 44, LH = 46, HEAD = 150, CAT = 62;
    var H = HEAD + render.length * CAT + total * LH + 80;
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    var x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);

    x.fillStyle = "#111"; x.font = "bold 40px -apple-system,'PingFang SC',sans-serif";
    x.fillText("采购清单", pad, 74);
    x.fillStyle = "#999"; x.font = "24px -apple-system,'PingFang SC',sans-serif";
    x.fillText("W1-11-02 · 共 " + total + " 项 · " +
               new Date().toLocaleDateString("zh-CN"), pad, 112);

    var y = HEAD;
    render.forEach(function(g){
      // 分类色条
      y += 14;
      x.fillStyle = "#f3f3ef";
      x.fillRect(pad - 12, y - 30, W - pad*2 + 24, CAT - 16);
      x.fillStyle = "#b5342a";
      x.fillRect(pad - 12, y - 30, 5, CAT - 16);
      x.fillStyle = "#111"; x.font = "bold 28px -apple-system,'PingFang SC',sans-serif";
      x.fillText(g.cat, pad + 4, y + 2);
      x.textAlign = "right";
      x.fillStyle = "#aaa"; x.font = "22px -apple-system,'PingFang SC',sans-serif";
      x.fillText(g.items.length + " 项", W - pad, y + 2);
      x.textAlign = "left";
      y += CAT - 12;

      g.items.forEach(function(it, i){
        if(i % 2 === 1){ x.fillStyle = "#fafaf8"; x.fillRect(pad - 12, y - 28, W - pad*2 + 24, LH - 4); }
        x.fillStyle = "#222"; x.font = "26px -apple-system,'PingFang SC',sans-serif";
        x.fillText(it.n, pad, y);
        x.textAlign = "right";
        x.fillStyle = "#b5342a"; x.font = "bold 26px -apple-system,'PingFang SC',sans-serif";
        x.fillText(it.q, W - pad, y);
        x.textAlign = "left";
        y += LH;
      });
    });

    x.fillStyle = "#cfcfca"; x.font = "20px -apple-system,'PingFang SC',sans-serif";
    x.fillText("菜谱目录 · W1-11-02", pad, H - 30);

    dlg.innerHTML = "<h3>采购清单图片</h3>"+
      "<div class='bighint'>长按下面这张图 → 存储到照片</div>"+
      "<img src='" + c.toDataURL("image/png") + "' style='width:100%;border-radius:12px;margin:10px 0'>"+
      "<div class='acts'><button id='closeBtn'>关闭</button></div>";
    dlg.classList.add("on"); mask.classList.add("on");
    document.getElementById("closeBtn").onclick = mask.onclick;
  };
 }catch(err){ if(window.console) console.log("shop err:", err.message); }
})();
</script>
