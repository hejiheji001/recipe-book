<script>
(function(){
 try{
  var KEY = "rb_shop_W1-11-02";
  var boxes = [].slice.call(document.querySelectorAll(".it input"));
  var doneEl = document.getElementById("done");

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
  function save(){ var m={}; boxes.forEach(function(b){ if(b.checked) m[b.getAttribute("data-i")]=1; });
    localStorage.setItem(KEY, JSON.stringify(m));
    if(window.RBSYNC) RBSYNC.save("rb_shop"); }
  function sync(){ doneEl.textContent = boxes.filter(function(b){ return b.checked; }).length; }

  function syncGroup(g){
    if(g === "season"){ syncSeasonGroup(); return; }
    var bs = [].slice.call(document.querySelectorAll('.it input[data-g="'+g+'"]'));
    var c = document.querySelector('.gc[data-g="'+g+'"]');
    if(!c || !bs.length) return;
    var n = bs.filter(function(b){ return b.checked; }).length;
    c.checked = (n === bs.length);
    c.indeterminate = (n>0 && n<bs.length);
  }
  function syncAllGroups(){ [].slice.call(document.querySelectorAll(".gc")).forEach(function(c){ syncGroup(c.getAttribute("data-g")); }); }

  function applyChecks(){
    var st = load();
    boxes.forEach(function(b){ b.checked = !!st[b.getAttribute("data-i")]; });
    sync(); syncAllGroups();
  }
  boxes.forEach(function(b){
    b.onchange = function(){ save(); sync(); syncGroup(b.getAttribute("data-g")); };
  });
  applyChecks();

  // ===== 生鲜：库存里已有的自动从清单剔除 =====
  var hideHave = false;

  function refreshFresh(){
    var s1 = loadStock();
    var hidden = 0;
    [].slice.call(document.querySelectorAll(".it[data-nm2]")).forEach(function(row){
      var n = row.getAttribute("data-nm2");
      var it = s1.items[n];
      var inStock = it && leftDays(n, it) > 0;
      if(inStock) hidden++;
      row.classList.toggle("instock", !!inStock);
      row.style.display = (inStock && !hideHave) ? "none" : "";
    });

    var bar = document.getElementById("hideBar");
    if(bar){
      bar.style.display = hidden ? "flex" : "none";
      bar.querySelector("b").textContent = hideHave
        ? ("收起家里有的（" + hidden + "）")
        : ("家里已有 " + hidden + " 项，已从清单剔除");
    }
  }

  var hb = document.getElementById("hideBar");
  if(hb) hb.onclick = function(){
    hideHave = !hideHave;
    refreshFresh();
  };

  [].slice.call(document.querySelectorAll("[data-have2]")).forEach(function(b){
    b.onclick = function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var n = b.getAttribute("data-have2");
      putInStock(n);
      refreshFresh();
      sync();
      toast(n + " 已移入库存");
    };
  });

  refreshFresh();

  // ===== 按剩余天数重算采购量（已过去的日子不再买）=====
  (function(){
    var DAYING = window.__DAYING__ || {};
    var keys = Object.keys(DAYING).sort();
    if(!keys.length) return;

    function pad2(n){ return ("0"+n).slice(-2); }
    var d0 = new Date();
    var today = d0.getFullYear()+"-"+pad2(d0.getMonth()+1)+"-"+pad2(d0.getDate());

    // 只累计今天及以后的日子
    var remain = {};
    var keepDays = [];
    keys.forEach(function(k){
      if(k < today) return;
      keepDays.push(k);
      DAYING[k].forEach(function(row){
        var n = row[0], qty = row[1], unit = row[2];
        var key = n + "|" + unit;
        remain[key] = (remain[key] || 0) + qty;
      });
    });

    // 全部过期 → 全隐藏，并提示
    if(!keepDays.length){
      [].slice.call(document.querySelectorAll(".it[data-nm2]")).forEach(function(r){
        r.style.display = "none";
      });
      var w = document.querySelector(".wrap") || document.body;
      var tip = document.createElement("div");
      tip.className = "pempty";
      tip.textContent = "这段时间的菜单都已过去，没有要买的了。";
      var firstSec = document.querySelector("section.cat");
      if(firstSec && firstSec.parentNode) firstSec.parentNode.insertBefore(tip, firstSec);
      var p0 = document.querySelector(".bar .p");
      if(p0) p0.innerHTML = "已选 <b id='done'>0</b>/0";
      return;
    }

    // 逐行改数量和「建议买」
    var shown = 0;
    [].slice.call(document.querySelectorAll(".it[data-nm2]")).forEach(function(row){
      var n = row.getAttribute("data-nm2");
      var u = row.getAttribute("data-unit") || "";
      var v = remain[n + "|" + u];

      if(v === undefined){
        row.style.display = "none";
        return;
      }
      shown++;

      var qEl = row.querySelector(".q");
      if(qEl){
        if(u === "g" || u === "ml"){
          var step = v >= 300 ? 100 : 50;
          qEl.textContent = (Math.ceil(v / step) * step) + u;
        } else if(u){
          qEl.textContent = Math.ceil(v) + u;
        } else {
          qEl.textContent = String(v);
        }
      }
      row.setAttribute("data-need", String(v));

      // 「用在」只留还没过去的日子
      var dEl = row.querySelector(".d");

          if(!has) return;
          var dt = new Date(dk + "T12:00:00");
          var label = "周" + wd[dt.getDay()];
          if(names.indexOf(label) < 0) names.push(label);
        });
        if(names.length) dEl.textContent = names.join("、");
      }
    });

    // 清掉没有剩余食材的分类

  var SEASON = window.__SEASON__ || {};

  var USE_DAYS = {"常备": null, "常用": 90, "偶尔": 150, "罕见": 240};
  var STOCK_KEY = "rb_stock";
  var DEFAULTS = ["盐","油","生抽","老抽","糖","生粉"];

  function loadStock(){
    try{ var o = JSON.parse(localStorage.getItem(STOCK_KEY)||"null"); return o && o.items ? o : {v:1, items:{}}; }
    catch(e){ return {v:1, items:{}}; }

  function saveStock(st){

  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function daysSince(s){ return Math.round((new Date(todayStr()) - new Date(s))/86400000); }

  var pickedCats = {};

  var POOL = window.__POOL__ || {};

  // 以当前规则为准（改 ing_pool.py 的冷却期能立即生效），
  // 池子里查不到才退回记录里的快照
  function coolDays(name, it){
    if(POOL[name] && POOL[name].d) return POOL[name].d;
    if(it && it.d) return it.d;
    var meta = SEASON[name] || {};
    var shelf = meta.shelf || 365;
    var use = USE_DAYS[meta.tier];
    return use ? Math.min(shelf, use) : shelf;
  }

  function leftDays(name, it){
    return coolDays(name, it) - daysSince(it.since);
  }

  function putInStock(name){
    var st = loadStock();
    if(!st.items[name]) st.items[name] = { since: todayStr(), d: coolDays(name, null) };
    saveStock(st);

  function saveShopList(){

    if(!items.length){ toast("没有要买的了"); return null; }
    var key = itemKey(items);
    var hit = loadLists().filter(function(x){ return itemKey(x.items || []) === key; })[0];
    if(hit){ toast("已在我的菜谱：" + hit.name); return hit; }
    var base = todayShort(), used = {}, i = 1;
    loadLists().concat(loadTrash()).forEach(function(x){

    });
    while(used[i]) i++;
    var nm = base + "-" + i, d = new Date(), ls = loadLists();
    var rec = { id:d.getTime(), name:nm,

  function wrap(ctx,text,maxW){
    var out=[],line="";
    for(var i=0;i<text.length;i++){
      var ch=text.charAt(i);
      if(ctx.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch;
    }
    if(line) out.push(line);
    return out;
  }

  function collectShopGroups(){
    // 与「存图片」同逻辑：有勾选只导勾选项，否则导全部
    var groups = [];
    [].slice.call(document.querySelectorAll("section.cat")).forEach(function(sec){
      if(sec.id === "seasonSec") return;
      var hEl = sec.querySelector("h2 .gh span");

                    q: el.querySelector(".q").textContent,
                    on: el.querySelector("input").checked });
      });
      groups.push({ cat: cat, items: arr });
    });
    var any = false;
    groups.forEach(function(g){ if(g.items.some(function(i){return i.on;})) any = true; });
    var out = [];
    groups.forEach(function(g){
      var items = any ? g.items.filter(function(i){ return i.on; }) : g.items;
      if(items.length) out.push({ cat: g.cat, items: items });
    });
    var sPicked = seasonPickedItems();
    if(sPicked.length) out.push({ cat: "调料", items: sPicked });

  function shopText(mode){
    var groups = collectShopGroups();
    var total = groups.reduce(function(s,g){ return s + g.items.length; }, 0);
    var d = new Date();
    var date = d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    var lines = [];

      lines.push("");
      lines.push("采购清单（" + total + " 项） · W1-11-02 · " + date);
    } else {
      lines.push("采购清单 · W1-11-02 · " + date);
      lines.push("共 " + total + " 项");
    }
    groups.forEach(function(g){
      lines.push("");
      lines.push("【" + g.cat + "】");
      g.items.forEach(function(it){ lines.push(it.n + "  " + it.q); });
    });
    return lines.join("\n");
  }
  function copyPlain(text, done){

      try{
        var ta=document.createElement("textarea");
        ta.value=text; ta.style.cssText="position:fixed;left:-9999px;top:0;";
        document.body.appendChild(ta); ta.select();
        var ok=document.execCommand("copy"); document.body.removeChild(ta); done(!!ok);
      }catch(e){ done(false); }
    }
  }

    var any = false;
    groups.forEach(function(g){ if(g.items.some(function(i){return i.on;})) any = true; });

    var render = [];

      render.push({ cat: "调料", items: sPicked.map(function(i){ return { n: i.n, q: i.q }; }) });
    }

    var total = render.reduce(function(s,g){ return s + g.items.length; }, 0);

    var W = 750, pad = 44, LH = 46, HEAD = 150, CAT = 62;
    var H = HEAD + render.length * CAT + total * LH + 80;
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    var x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);

    x.fillStyle = "#111"; x.font = "bold 40px -apple-system,'PingFang SC',sans-serif";
    x.fillText("采购清单", pad, 74);
    x.fillStyle = "#999"; x.font = "24px -apple-system,'PingFang SC',sans-serif";
    x.fillText("W1-11-02 · 共 " + total + " 项 · " +
               new Date().toLocaleDateString("zh-CN"), pad, 112);

    var y = HEAD;
    render.forEach(function(g){
      // 分类色条
      y += 14;
      x.fillStyle = "#f3f3ef";
      x.fillRect(pad - 12, y - 30, W - pad*2 + 24, CAT - 16);
      x.fillStyle = "#b5342a";
      x.fillRect(pad - 12, y - 30, 5, CAT - 16);
      x.fillStyle = "#111"; x.font = "bold 28px -apple-system,'PingFang SC',sans-serif";

      x.fillStyle = "#aaa"; x.font = "22px -apple-system,'PingFang SC',sans-serif";
      x.fillText(g.items.length + " 项", W - pad, y + 2);
      x.textAlign = "left";
      y += CAT - 12;

      g.items.forEach(function(it, i){
        if(i % 2 === 1){ x.fillStyle = "#fafaf8"; x.fillRect(pad - 12, y - 28, W - pad*2 + 24, LH - 4); }
        x.fillStyle = "#222"; x.font = "26px -apple-system,'PingFang SC',sans-serif";

        x.textAlign = "right";
        x.fillStyle = "#b5342a"; x.font = "bold 26px -apple-system,'PingFang SC',sans-serif";
        x.fillText(it.q, W - pad, y);
        x.textAlign = "left";
        y += LH;
      });
    });

    x.fillStyle = "#cfcfca"; x.font = "20px -apple-system,'PingFang SC',sans-serif";
    x.fillText("菜谱目录 · W1-11-02", pad, H - 30);

    dlg.innerHTML = "<h3>采购清单图片</h3>"+
      "<div class='bighint'>长按下面这张图 → 存储到照片</div>"+
      "<img src='" + c.toDataURL("image/png") + "' style='width:100%;border-radius:12px;margin:10px 0'>"+
      "<div class='acts'><button id='closeBtn'>关闭</button></div>";
    dlg.classList.add("on"); mask.classList.add("on");
    document.getElementById("closeBtn").onclick = mask.onclick;
  };
 }catch(err){ if(window.console) console.log("shop err:", err.message); }
})();
