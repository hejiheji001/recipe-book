<script>
(function(){
 try{
  var KEY = "rb_shop_W1-11-02";
  var boxes = [].slice.call(document.querySelectorAll(".it input"));
  var doneEl = document.getElementById("done");

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
  function save(){ var m={}; boxes.forEach(function(b){ if(b.checked) m[b.getAttribute("data-i")]=1; });
    localStorage.setItem(KEY, JSON.stringify(m)); }
  function sync(){ doneEl.textContent = boxes.filter(function(b){ return b.checked; }).length; }

  function syncGroup(g){
    var bs = [].slice.call(document.querySelectorAll('.it input[data-g="'+g+'"]'));
    var c = document.querySelector('.gc[data-g="'+g+'"]');
    if(!c || !bs.length) return;
    var n = bs.filter(function(b){ return b.checked; }).length;
    c.checked = (n === bs.length);
    c.indeterminate = (n>0 && n<bs.length);
  }
  function syncAllGroups(){ [].slice.call(document.querySelectorAll(".gc")).forEach(function(c){ syncGroup(c.getAttribute("data-g")); }); }

  var st = load();
  boxes.forEach(function(b){
    if(st[b.getAttribute("data-i")]) b.checked = true;
    b.onchange = function(){ save(); sync(); syncGroup(b.getAttribute("data-g")); };
  });
  sync(); syncAllGroups();

  [].slice.call(document.querySelectorAll(".gc")).forEach(function(c){
    c.onclick = function(ev){
      ev.stopPropagation();
      var g = c.getAttribute("data-g");
      document.querySelectorAll('.it input[data-g="'+g+'"]').forEach(function(b){ b.checked = c.checked; });
      save(); sync(); syncGroup(g);
    };
  });

  // ===== 本周调料（按库存现场计算）=====
  var SEASON = window.__SEASON__ || {};
  var WEEKP = window.__WEEKPANT__ || {};
  var USE_DAYS = {"常备": null, "常用": 90, "偶尔": 150, "罕见": 240};
  var STOCK_KEY = "rb_stock";
  var DEFAULTS = ["盐","油","生抽","老抽","糖","生粉"];

  function loadStock(){
    try{ var o = JSON.parse(localStorage.getItem(STOCK_KEY)||"null"); return o && o.items ? o : {v:1, items:{}}; }
    catch(e){ return {v:1, items:{}}; }
  }
  function saveStock(st){ localStorage.setItem(STOCK_KEY, JSON.stringify(st)); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function daysSince(s){ return Math.round((new Date(todayStr()) - new Date(s))/86400000); }

  function leftDays(name, it){
    var meta = SEASON[name] || {};
    var shelf = meta.shelf || 365;
    var use = USE_DAYS[meta.tier];
    var cap = use ? Math.min(shelf, use) : shelf;
    return cap - daysSince(it.since);
  }

  function renderSeason(){
    var sec = document.getElementById("seasonSec");
    var list = document.getElementById("seasonList");
    var names = Object.keys(WEEKP);
    if(!names.length){ sec.style.display="none"; return; }
    sec.style.display="block";

    var st = loadStock();
    var buy = [], have = [];
    names.sort(function(a,b){ return (WEEKP[b]||0)-(WEEKP[a]||0); });
    names.forEach(function(n){
      var it = st.items[n];
      if(it && leftDays(n, it) > 0) have.push({n:n, it:it});
      else buy.push(n);
    });

    var h = "";
    h += "<div class='pnote'>本周用到 " + names.length + " 种调料。" +
         "家里有的勾进库存，其余进采购。"+
         " <b id='quickPick'>确认家里有的 ›</b></div>";
    if(buy.length){
      h += "<div class='shgrp'>要买（"+buy.length+"）</div>";
      buy.forEach(function(n){
        var meta = SEASON[n] || {};
        h += "<label class='it'><input type='checkbox' data-season='"+escT(n)+"'>"+
             "<span class='nm'>"+escT(n)+"</span>"+
             "<span class='q'>1 份</span>"+
             "<span class='d'>"+(meta.n? meta.n+" 道菜用过":"")+"</span></label>";
      });
    }
    if(have.length){
      h += "<div class='shgrp'>已有（"+have.length+"）</div>";
      have.forEach(function(o){
        var meta = SEASON[o.n] || {};
        var lab = meta.tier === "常备" ? "常备" : ("还够用约 " + Math.max(0,leftDays(o.n,o.it)) + " 天");
        h += "<div class='it have'><span class='nm'>"+escT(o.n)+"</span>"+
             "<span class='q' style='color:#2f7a45'>"+lab+"</span>"+
             "<span class='d'></span></div>";
      });
    }
    list.innerHTML = h;

    var qp = document.getElementById("quickPick");
    if(qp) qp.onclick = openPick;
  }

  function escT(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

  // 快速确认弹层
  function openPick(){
    var st = loadStock();
    var names = Object.keys(WEEKP).sort(function(a,b){ return (WEEKP[b]||0)-(WEEKP[a]||0); });
    var html = "<h3>家里已经有的调料</h3>"+
      "<div class='sub'>勾上的进库存，下次不再提醒。</div>"+
      "<div class='picklist'>";
    names.forEach(function(n){
      var on = st.items[n] ? " checked" : (DEFAULTS.indexOf(n)>=0 ? " checked" : "");
      html += "<label class='pk'><input type='checkbox' data-pk='"+escT(n)+"'"+on+">"+
              "<span>"+escT(n)+"</span><i>"+(WEEKP[n]||0)+" 道菜</i></label>";
    });
    html += "</div><div class='acts'><button id='pkCancel'>取消</button>"+
            "<button id='pkOk'>确认</button></div>";
    dlg.innerHTML = html;
    dlg.classList.add("on"); mask.classList.add("on");
    document.getElementById("pkCancel").onclick = mask.onclick;
    document.getElementById("pkOk").onclick = function(){
      var st2 = loadStock();
      [].slice.call(dlg.querySelectorAll("[data-pk]")).forEach(function(cb){
        var n = cb.getAttribute("data-pk");
        if(cb.checked){
          if(!st2.items[n]) st2.items[n] = { since: todayStr() };
        } else {
          delete st2.items[n];
        }
      });
      saveStock(st2);
      dlg.classList.remove("on"); mask.classList.remove("on");
      dlg.innerHTML = "";
      renderSeason();      // 采购清单实时重算
      sync();
      toast("库存已更新");
    };
  }

  renderSeason();

  document.getElementById("all").onclick = function(){
    var all = boxes.every(function(b){ return b.checked; });
    boxes.forEach(function(b){ b.checked = !all; });
    save(); sync(); syncAllGroups();
  };
  document.getElementById("clear").onclick = function(){
    boxes.forEach(function(b){ b.checked = false; });
    save(); sync(); syncAllGroups();
  };

  // 分类筛选（多选）
  var pickedCats = {};
  function applyCats(){
    var all = Object.keys(pickedCats).length === 0;
    [].slice.call(document.querySelectorAll("section.cat")).forEach(function(s){
      s.classList.toggle("on", all || pickedCats[s.getAttribute("data-g")] === 1);
    });
    var allChip = document.querySelector('.cf[data-g=""]');
    if(allChip) allChip.classList.toggle("on", all);
  }
  [].slice.call(document.querySelectorAll(".cf")).forEach(function(c){
    c.onclick = function(){
      var g = c.getAttribute("data-g");
      if(g === ""){
        pickedCats = {};
        boxes.forEach(function(b){ b.checked = false; });
      }
      else if(pickedCats[g]){ delete pickedCats[g]; }
      else { pickedCats[g] = 1; }
      // 选中分类 → 该分类下全部勾上；取消 → 全部取消
      [].slice.call(document.querySelectorAll("section.cat")).forEach(function(sec){
        var gi2 = sec.getAttribute("data-g");
        var on = (g === "") ? false : (pickedCats[gi2] === 1);
        if(g === "") return;
        [].slice.call(sec.querySelectorAll(".it input")).forEach(function(b){ b.checked = on; });
        syncGroup(gi2);
      });
      save(); sync();
      [].slice.call(document.querySelectorAll(".cf")).forEach(function(x){
        var gg = x.getAttribute("data-g");
        if(gg !== "") x.classList.toggle("on", pickedCats[gg] === 1);
      });
      applyCats();
    };
  });
  applyCats();

  function pad(n){ return ("0"+n).slice(-2); }
  function todayStr(){ var d=new Date(); return pad(d.getMonth()+1)+"/"+pad(d.getDate()); }
  function loadLists(){ try{ return JSON.parse(localStorage.getItem("rb_lists")||"[]"); }catch(e){ return []; } }
  function loadTrash(){ try{ return JSON.parse(localStorage.getItem("rb_trash")||"[]"); }catch(e){ return []; } }

  function toast(msg){
    var t=document.getElementById("toast");
    t.textContent=msg; t.style.display="block";
    setTimeout(function(){ t.style.display="none"; },1500);
  }

  document.getElementById("save").onclick = function(){
    var items = [].slice.call(document.querySelectorAll(".it")).map(function(el){
      return { n: el.querySelector(".nm").textContent, q: el.querySelector(".q").textContent };
    });
    var base = todayStr(), used = {}, i = 1;
    loadLists().concat(loadTrash()).forEach(function(x){
      var nm=(x.name||""); if(nm.indexOf(base)===0){ var m=nm.match(/-([0-9]+)$/); used[m?+m[1]:1]=1; }
    });
    while(used[i]) i++;
    var nm = base + "-" + i, d = new Date(), ls = loadLists();
    ls.unshift({ id:d.getTime(), name:nm,
      date:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),
      items:items, dishes:[], from:"本周菜单 W1-11-02" });
    localStorage.setItem("rb_lists", JSON.stringify(ls));
    toast("已保存：" + nm);
  };

  var mask=document.getElementById("mask"), dlg=document.getElementById("dlg");
  mask.onclick=function(){ dlg.classList.remove("on"); mask.classList.remove("on"); };

  function wrap(ctx,text,maxW){
    var out=[],line="";
    for(var i=0;i<text.length;i++){
      var ch=text.charAt(i);
      if(ctx.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch;
    }
    if(line) out.push(line);
    return out;
  }

  document.getElementById("img").onclick = function(){
    // 按分类收集（保留分组）
    var groups = [];
    [].slice.call(document.querySelectorAll("section.cat")).forEach(function(sec){
      var h = sec.querySelector("h2 .gh span");
      var cat = h ? h.textContent : "其他";
      var arr = [];
      [].slice.call(sec.querySelectorAll(".it")).forEach(function(el){
        arr.push({ n: el.querySelector(".nm").textContent,
                    q: el.querySelector(".q").textContent,
                    on: el.querySelector("input").checked });
      });
      groups.push({ cat: cat, items: arr });
    });

    // 有勾选就只导出勾选的分类/条目
    var any = false;
    groups.forEach(function(g){ if(g.items.some(function(i){return i.on;})) any = true; });

    var render = [];
    groups.forEach(function(g){
      var items = any ? g.items.filter(function(i){ return i.on; }) : g.items;
      if(items.length) render.push({ cat: g.cat, items: items });
    });

    var total = render.reduce(function(s,g){ return s + g.items.length; }, 0);

    var W = 750, pad = 44, LH = 46, HEAD = 150, CAT = 62;
    var H = HEAD + render.length * CAT + total * LH + 80;
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    var x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);

    x.fillStyle = "#111"; x.font = "bold 40px -apple-system,'PingFang SC',sans-serif";
    x.fillText("采购清单", pad, 74);
    x.fillStyle = "#999"; x.font = "24px -apple-system,'PingFang SC',sans-serif";
    x.fillText("W1-11-02 · 共 " + total + " 项 · " +
               new Date().toLocaleDateString("zh-CN"), pad, 112);

    var y = HEAD;
    render.forEach(function(g){
      // 分类色条
      y += 14;
      x.fillStyle = "#f3f3ef";
      x.fillRect(pad - 12, y - 30, W - pad*2 + 24, CAT - 16);
      x.fillStyle = "#b5342a";
      x.fillRect(pad - 12, y - 30, 5, CAT - 16);
      x.fillStyle = "#111"; x.font = "bold 28px -apple-system,'PingFang SC',sans-serif";
      x.fillText(g.cat, pad + 4, y + 2);
      x.textAlign = "right";
      x.fillStyle = "#aaa"; x.font = "22px -apple-system,'PingFang SC',sans-serif";
      x.fillText(g.items.length + " 项", W - pad, y + 2);
      x.textAlign = "left";
      y += CAT - 12;

      g.items.forEach(function(it, i){
        if(i % 2 === 1){ x.fillStyle = "#fafaf8"; x.fillRect(pad - 12, y - 28, W - pad*2 + 24, LH - 4); }
        x.fillStyle = "#222"; x.font = "26px -apple-system,'PingFang SC',sans-serif";
        x.fillText(it.n, pad, y);
        x.textAlign = "right";
        x.fillStyle = "#b5342a"; x.font = "bold 26px -apple-system,'PingFang SC',sans-serif";
        x.fillText(it.q, W - pad, y);
        x.textAlign = "left";
        y += LH;
      });
    });

    x.fillStyle = "#cfcfca"; x.font = "20px -apple-system,'PingFang SC',sans-serif";
    x.fillText("菜谱目录 · W1-11-02", pad, H - 30);

    dlg.innerHTML = "<h3>采购清单图片</h3>"+
      "<div class='bighint'>长按下面这张图 → 存储到照片</div>"+
      "<img src='" + c.toDataURL("image/png") + "' style='width:100%;border-radius:12px;margin:10px 0'>"+
      "<div class='acts'><button id='closeBtn'>关闭</button></div>";
    dlg.classList.add("on"); mask.classList.add("on");
    document.getElementById("closeBtn").onclick = mask.onclick;
  };
 }catch(err){ if(window.console) console.log("shop err:", err.message); }
})();
</script>
</body></html>
