<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>打印清单 · W1-11-02</title>
<style>
*{box-sizing:border-box;-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;background:#d9d9d1;color:#111;
 font:15px/1.6 "PingFang SC","Hiragino Sans GB",sans-serif;}
body{min-height:100vh;display:flex;flex-direction:column;}
.stickytop{position:-webkit-sticky;position:sticky;top:0;z-index:20;
 background:#fff;border-bottom:1px solid #e6e6e2;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.sitenav{display:flex;padding:0 4px;}
.sitenav a{flex:1;display:flex;align-items:center;justify-content:center;
 text-align:center;font-size:13px;padding:12px 2px;color:#666;
 text-decoration:none;font-weight:500;white-space:nowrap;}
.sitenav a.on{color:#111;font-weight:700;box-shadow:inset 0 -2px 0 #111;}
.sitenav a.hot{color:#b5342a;font-weight:600;}
.head{padding:8px 14px 5px;display:flex;justify-content:space-between;
 align-items:center;font-size:11.5px;color:#6b6b64;}
.hact{display:flex;align-items:center;gap:8px;}
.hact b{font-size:11.5px;font-weight:700;color:#111;background:#fff;
 border:1px solid #c9c9c0;border-radius:7px;padding:4px 9px;cursor:pointer;}
.hact em{font-style:normal;color:#9a9a94;}
.main{flex:1 0 auto;padding:0 10px 84px;}
.sec{margin-top:10px;}
.sec h2{font-size:14px;margin:0 0 6px;color:#111;font-weight:800;letter-spacing:.5px;
 display:flex;justify-content:space-between;align-items:baseline;}
.sec h2 em{font-style:normal;font-size:12px;color:#aaa;font-weight:500;}
.card{background:#f3f3ee;border:1px solid #cfcfc6;border-radius:10px;
 padding:10px;margin-bottom:7px;}
.rowt{display:flex;align-items:center;gap:8px;}
.ok{flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:#2f7a45;
 color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.meta{flex:1;min-width:0;}
.nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sub2{font-size:11px;color:#8a8a84;margin-top:1px;}
.acts{display:flex;gap:5px;margin-top:7px;}
.acts a,.acts b{flex:1;text-align:center;text-decoration:none;font-size:13px;
 padding:8px 0;border-radius:8px;font-weight:600;cursor:pointer;
 -webkit-tap-highlight-color:transparent;}
.open{background:#ffffff;color:#111;border:1px solid #b9b9b0;}
.delx{background:#ffffff;color:#c0392b;border:1px solid #e6c9c4;flex:0 0 66px;}

.empty{color:#8a8a84;text-align:center;padding:18px 0;font-size:12.5px;}
.oldtag{display:inline-block;font-size:10px;font-weight:700;color:#8a5a12;
 background:#fdf3e3;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px;}
.foot{text-align:center;color:#c4c4be;font-size:11.5px;padding:10px 0 24px;flex:1 0 auto;}
.bottombar{position:-webkit-sticky;position:sticky;bottom:0;z-index:30;display:flex;gap:6px;
 padding:8px 10px calc(8px + env(safe-area-inset-bottom));
 background:#fff;border-top:1px solid #e6e6e2;box-shadow:0 -3px 12px rgba(0,0,0,.07);}
.bottombar a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:600;
 padding:10px 0;border-radius:9px;background:#fff;color:#444;border:1px solid #e0e0dc;}
#view{display:none;position:fixed;left:0;right:0;top:0;bottom:0;z-index:400;
 background:#fff;flex-direction:column;}
#view.on{display:flex;}
.vbar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px;background:#111;}
.vbar b{flex:1;text-align:center;font-size:15px;font-weight:700;color:#fff;
 padding:11px 0;border-radius:9px;cursor:pointer;}
.vbar #vBack{background:#3a3a36;flex:0 0 70px;}
.vbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;}
.vbody img{width:100%;display:block;border-radius:8px;margin-bottom:10px;background:#fff;}
@media print{
  .stickytop,.bottombar,.foot,.head,.acts{display:none !important;}
  .vbar{display:none !important;}
  #view{position:static !important;display:block !important;}
  .vbody{overflow:visible !important;padding:0 !important;}
  .vbody img{box-shadow:none;border-radius:0;margin:0;page-break-after:always;width:100%;}
  .vbody img:last-child{page-break-after:auto;}
  @page{size:A4;margin:6mm;}
}
</style></head><body>

<div class="stickytop">
  <div class="sitenav">
    <a href="./">本周菜单</a>
    <a href="shopping.html" class="hot">本周采购</a>
    <a href="../">总菜谱</a>
    <a href="print.html" class="on">打印清单</a>
  </div>
</div>

<div class="head"><span>更新 11-02 23:30</span>
  <span class="hact"><b id="reload">刷新</b> <em>W1-11-02</em></span></div>

<div class="main">
  <div class="sec">
    <h2>AI 推荐 <em>系统生成</em></h2>
    <div class="card">
      <div class="rowt">
        <span class="ok">✓</span>
        <div class="meta">
          <div class="nm">本周打印 · 9 页</div>
          <div class="sub2">采购清单 + 一周总览 + 7 天菜谱</div>
        </div>
      </div>
      <div class="acts">
        <a class="open" href="print.pdf" target="_blank" rel="noopener">打开 PDF（打开后点分享 → 微信）</a>
      </div>
    </div>
  </div>

  <div class="sec">
    <h2>自定义打印 <em>自己挑的菜</em></h2>
    <div id="mine"><div class="empty">还没有。<br>在总菜谱选菜 → 生成清单 → 打印PDF → 生成 PDF<br>生成后点上方「刷新」</div></div>
  </div>
</div>

<div class="foot">菜谱目录 · W1-11-02</div>

<div class="bottombar">
  <a href="../?open=mylist">我的单</a>
  <a href="../?open=trash">回收站</a>
</div>

<div id="view">
  <div class="vbar"><b id="vBack">关闭</b><b id="vPrint">打印 / 分享</b></div>
  <div class="vbody" id="vBody"><img src="pg/p1.jpg" alt="第1页"><img src="pg/p2.jpg" alt="第2页"><img src="pg/p3.jpg" alt="第3页"><img src="pg/p4.jpg" alt="第4页"><img src="pg/p5.jpg" alt="第5页"><img src="pg/p6.jpg" alt="第6页"><img src="pg/p7.jpg" alt="第7页"><img src="pg/p8.jpg" alt="第8页"><img src="pg/p9.jpg" alt="第9页"></div>
</div>

<script>
(function(){
  var view=document.getElementById("view"), vBody=document.getElementById("vBody");
  document.getElementById("vBack").onclick=function(){ view.classList.remove("on"); };
  document.getElementById("vPrint").onclick=function(){
    try{ window.print(); }catch(e){ alert("请用「分享」→打印"); }
  };

  // ===== 分享 PDF（iOS 会弹系统分享面板，可直接选微信）=====

  function sharePdf(blob, name){
    var file = null;
    try{ file = new File([blob], name + ".pdf", {type:"application/pdf"}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:name}).catch(function(){ showViewer(); });
      return;
    }
    showViewer();     // 不支持分享 → 页面内预览
  }

  function showViewer(){
    view.classList.add("on");
    view.scrollTop = 0;
    window.scrollTo(0,0);
  }

  document.getElementById("reload").onclick = function(){
    location.reload();
  };

  // ===== 自定义打印（读 localStorage 元数据）=====
  function loadPrints(){
    try{ return JSON.parse(localStorage.getItem("rb_prints")||"[]"); }catch(e){ return []; }
  }
  function escT(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

  function render(list){
    var box=document.getElementById("mine");
    if(!list.length){
      box.innerHTML="<div class='empty'>还没有。<br>在总菜谱选菜 → 生成清单 → 打印PDF → 生成 PDF<br>生成后点上方「刷新」</div>";
      return;
    }
    list.sort(function(a,b){ return (b.at||0)-(a.at||0); });
    box.innerHTML = list.map(function(it){
      return "<div class='card' data-id='"+it.id+"'>"+
        "<div class='rowt'><span class='ok'>✓</span><div class='meta'>"+
        "<div class='nm'>"+escT(it.name)+"</div>"+
        "<div class='sub2'>"+it.date+" · "+(it.dishes?it.dishes.length:0)+" 道菜</div>"+
        "</div></div>"+
        "<div class='acts'>"+
        "<a class='open' href='../?print="+it.id+"'>打开 · 生成 PDF</a>"+
        "<b class='delx' data-del='"+it.id+"'>删除</b></div></div>";
    }).join("");

    [].slice.call(box.querySelectorAll("[data-del]")).forEach(function(b){
      b.onclick=function(){
        var id=+b.getAttribute("data-del");
        if(!confirm("删除这条记录？")) return;
        localStorage.setItem("rb_prints", JSON.stringify(
          loadPrints().filter(function(x){ return x.id!==id; })));
        load();
      };
    });
  }

  function load(){
    try{ render(loadPrints()); }
    catch(e){ document.getElementById("mine").innerHTML="<div class='empty'>读取失败，点上方「刷新」</div>"; }
  }
  load();
})();
</script>
</body></html>
