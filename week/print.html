<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>打印清单 · W1-11-02</title>
<style>
*{box-sizing:border-box;-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;background:#fafaf8;color:#111;
 font:15px/1.6 "PingFang SC","Hiragino Sans GB",sans-serif;}
body{min-height:100vh;display:flex;flex-direction:column;}
.stickytop{position:-webkit-sticky;position:sticky;top:0;z-index:20;
 background:#fff;border-bottom:1px solid #e6e6e2;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.sitenav{display:flex;padding:0 4px;}
.sitenav a{flex:1;display:flex;align-items:center;justify-content:center;
 text-align:center;font-size:13px;padding:12px 2px;color:#666;
 text-decoration:none;font-weight:500;white-space:nowrap;}
.sitenav a.on{color:#111;font-weight:700;box-shadow:inset 0 -2px 0 #111;}
.sitenav a.hot{color:#b5342a;font-weight:600;}
.head{padding:12px 16px 8px;display:flex;justify-content:space-between;
 align-items:baseline;font-size:13px;color:#999;}
.main{flex:1 0 auto;padding:0 14px 90px;}
.sec{margin-top:14px;}
.sec h2{font-size:14px;margin:0 0 8px;color:#111;font-weight:800;letter-spacing:.5px;
 display:flex;justify-content:space-between;align-items:baseline;}
.sec h2 em{font-style:normal;font-size:12px;color:#aaa;font-weight:500;}
.card{background:#fff;border:1px solid #e8e8e3;border-radius:12px;
 padding:14px;margin-bottom:10px;}
.rowt{display:flex;align-items:center;gap:10px;}
.ok{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#2f7a45;
 color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.meta{flex:1;min-width:0;}
.nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sub2{font-size:11.5px;color:#aaa;margin-top:2px;}
.acts{display:flex;gap:8px;margin-top:10px;}
.acts a,.acts b{flex:1;text-align:center;text-decoration:none;font-size:13.5px;
 padding:10px 0;border-radius:9px;font-weight:600;cursor:pointer;
 -webkit-tap-highlight-color:transparent;}
.open{background:#111;color:#fff;border:1px solid #111;}
.delx{background:#fff;color:#c0392b;border:1px solid #f0d5d0;flex:0 0 76px;}
.big{background:#b5342a;color:#fff;border:1px solid #b5342a;}
.empty{color:#bbb;text-align:center;padding:26px 0;font-size:13.5px;}
.foot{text-align:center;color:#c4c4be;font-size:11.5px;padding:10px 0 24px;flex:1 0 auto;}
.bottombar{position:-webkit-sticky;position:sticky;bottom:0;z-index:30;display:flex;gap:6px;
 padding:8px 10px calc(8px + env(safe-area-inset-bottom));
 background:#fff;border-top:1px solid #e6e6e2;box-shadow:0 -3px 12px rgba(0,0,0,.07);}
.bottombar a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:600;
 padding:10px 0;border-radius:9px;background:#fff;color:#444;border:1px solid #e0e0dc;}
#view{display:none;position:fixed;left:0;right:0;top:0;bottom:0;z-index:400;
 background:#fff;flex-direction:column;}
#view.on{display:flex;}
.vbar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px;background:#111;}
.vbar b{flex:1;text-align:center;font-size:15px;font-weight:700;color:#fff;
 padding:11px 0;border-radius:9px;cursor:pointer;}
.vbar #vBack{background:#3a3a36;flex:0 0 70px;}
.vbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;}
.vbody img{width:100%;display:block;border-radius:8px;margin-bottom:10px;background:#fff;}
@media print{
  .stickytop,.bottombar,.foot,.head,.acts{display:none !important;}
  .vbar{display:none !important;}
  #view{position:static !important;display:block !important;}
  .vbody{overflow:visible !important;padding:0 !important;}
  .vbody img{box-shadow:none;border-radius:0;margin:0;page-break-after:always;width:100%;}
  .vbody img:last-child{page-break-after:auto;}
  @page{size:A4;margin:6mm;}
}
</style></head><body>

<div class="stickytop">
  <div class="sitenav">
    <a href="./">本周菜单</a>
    <a href="shopping.html" class="hot">本周采购</a>
    <a href="../">总菜谱</a>
    <a href="print.html" class="on">打印清单</a>
  </div>
</div>

<div class="head"><span>更新 11-02 22:08</span><span>W1-11-02</span></div>

<div class="main">
  <div class="sec">
    <h2>每周打印 <em>系统生成</em></h2>
    <div class="card">
      <div class="rowt">
        <span class="ok">✓</span>
        <div class="meta">
          <div class="nm">本周打印 · 9 页</div>
          <div class="sub2">采购清单 + 一周总览 + 7 天菜谱</div>
        </div>
      </div>
      <div class="acts">
        <b class="open" id="openWeek">打开 / 打印</b>
        <a class="delx" href="print.pdf" target="_blank" rel="noopener">原始 PDF</a>
      </div>
    </div>
  </div>

  <div class="sec">
    <h2>我的打印 <em>自己挑的菜</em></h2>
    <div id="mine"><div class="empty">还没有。在总菜谱里选菜 → 生成清单 → 打印PDF → 生成 PDF</div></div>
  </div>
</div>

<div class="foot">菜谱目录 · W1-11-02</div>

<div class="bottombar">
  <a href="../?open=mylist">我的单</a>
  <a href="../?open=trash">回收站</a>
</div>

<div id="view">
  <div class="vbar"><b id="vBack">关闭</b><b id="vPrint">打印 / 分享</b></div>
  <div class="vbody" id="vBody"><img src="pg/p1.jpg" alt="第1页"><img src="pg/p2.jpg" alt="第2页"><img src="pg/p3.jpg" alt="第3页"><img src="pg/p4.jpg" alt="第4页"><img src="pg/p5.jpg" alt="第5页"><img src="pg/p6.jpg" alt="第6页"><img src="pg/p7.jpg" alt="第7页"><img src="pg/p8.jpg" alt="第8页"><img src="pg/p9.jpg" alt="第9页"></div>
</div>

<script>
(function(){
  var view=document.getElementById("view"), vBody=document.getElementById("vBody");
  document.getElementById("openWeek").onclick=function(){
    view.classList.add("on"); window.scrollTo(0,0);
  };
  document.getElementById("vBack").onclick=function(){ view.classList.remove("on"); };
  document.getElementById("vPrint").onclick=function(){
    try{ window.print(); }catch(e){ alert("请用「分享」→打印"); }
  };

  // 读自定义 PDF
  function idbOpen(){
    return new Promise(function(res,rej){
      var r=indexedDB.open("rb_pdf",1);
      r.onupgradeneeded=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains("pdfs")) db.createObjectStore("pdfs",{keyPath:"id"});
      };
      r.onsuccess=function(e){ res(e.target.result); };
      r.onerror=function(){ rej(r.error); };
    });
  }
  function idbAll(){
    return idbOpen().then(function(db){
      return new Promise(function(res,rej){
        var tx=db.transaction("pdfs","readonly");
        var q=tx.objectStore("pdfs").getAll();
        q.onsuccess=function(){ res(q.result||[]); };
        q.onerror=function(){ rej(q.error); };
      });
    });
  }
  function idbDel(id){
    return idbOpen().then(function(db){
      return new Promise(function(res,rej){
        var tx=db.transaction("pdfs","readwrite");
        tx.objectStore("pdfs").delete(id);
        tx.oncomplete=res; tx.onerror=function(){ rej(tx.error); };
      });
    });
  }

  var urls={};
  function render(list){
    var box=document.getElementById("mine");
    if(!list.length){
      box.innerHTML="<div class='empty'>还没有。在总菜谱里选菜 → 生成清单 → 打印PDF → 生成 PDF</div>";
      return;
    }
    list.sort(function(a,b){ return b.at-a.at; });
    box.innerHTML = list.map(function(it){
      var kb=Math.round((it.size||0)/1024);
      return "<div class='card' data-id='"+it.id+"'>"+
        "<div class='rowt'><span class='ok'>✓</span><div class='meta'>"+
        "<div class='nm'>"+esc(it.name)+"</div>"+
        "<div class='sub2'>"+it.date+" · "+kb+" KB</div></div></div>"+
        "<div class='acts'><b class='open' data-open='"+it.id+"'>打开 / 分享到微信</b>"+
        "<b class='delx' data-del='"+it.id+"'>删除</b></div></div>";
    }).join("");

    [].slice.call(box.querySelectorAll("[data-open]")).forEach(function(b){
      b.onclick=function(){
        var id=+b.getAttribute("data-open");
        var it=list.filter(function(x){return x.id===id;})[0];
        if(!it) return;
        var u=URL.createObjectURL(it.blob);
        window.open(u,"_blank");
        setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
      };
    });
    [].slice.call(box.querySelectorAll("[data-del]")).forEach(function(b){
      b.onclick=function(){
        var id=+b.getAttribute("data-del");
        if(!confirm("删除这份打印件？")) return;
        idbDel(id).then(function(){ load(); });
      };
    });
  }
  function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

  function load(){
    idbAll().then(render).catch(function(){
      document.getElementById("mine").innerHTML="<div class='empty'>读取失败</div>";
    });
  }
  load();
})();
</script>
</body></html>
