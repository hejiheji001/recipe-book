<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>打印版 · W1-11-02</title>
<style>
*{box-sizing:border-box;-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;height:100%;background:#fff;color:#111;
 font:15px/1.6 "PingFang SC","Hiragino Sans GB",sans-serif;overflow:hidden;}
.stickytop{position:-webkit-sticky;position:sticky;top:0;z-index:9;
 background:#fff;border-bottom:1px solid #e6e6e2;flex:0 0 auto;}
.sitenav{display:flex;padding:0 4px;border-bottom:1px solid #f0f0ec;}
.sitenav a{flex:1;display:flex;align-items:center;justify-content:center;
 text-align:center;font-size:13px;padding:12px 2px;color:#666;
 text-decoration:none;font-weight:500;white-space:nowrap;}
.sitenav a.on{color:#111;font-weight:700;box-shadow:inset 0 -2px 0 #111;}
.sitenav a.hot{color:#b5342a;font-weight:600;}
.subtabs{display:flex;gap:6px;padding:8px 12px;}
.subtabs b{flex:1;text-align:center;font-size:13.5px;font-weight:600;
 padding:9px 0;border:1px solid #e0e0dc;border-radius:9px;color:#666;background:#fff;
 cursor:pointer;-webkit-tap-highlight-color:transparent;}
.subtabs b.on{background:#111;color:#fff;border-color:#111;}
#view{width:100%;height:calc(100% - 0px);border:0;display:block;background:#f4f4f1;}
.wrap{display:flex;flex-direction:column;height:100%;}
.body{flex:1 1 auto;position:relative;min-height:0;}
.body iframe{width:100%;height:100%;border:0;display:block;}
.tip{padding:9px 14px;font-size:12.5px;color:#8a8a85;background:#fafaf8;
 border-bottom:1px solid #eee;text-align:center;}
.tip b{color:#6b4d10;}
</style></head><body>
<div class="wrap">
  <div class="stickytop">
    <div class="sitenav">
      <a href="../">菜谱目录</a>
      <a href="./">本周菜单</a>
      <a href="print.html" class="on">打印版</a>
      <a href="shopping.html" class="hot">采购清单</a>
    </div>
    <div class="subtabs">
      <b class="on" data-src="print.pdf">打印版 9 页</b>
      <b data-src="overview.pdf">一周总览 1 页</b>
    </div>
  </div>
  <div class="tip">双指捏合可放大　·　<b>点上面切换</b></div>
  <div class="body">
    <iframe id="view" src="print.pdf#view=FitH"></iframe>
  </div>
</div>
<script>
(function(){
  var tabs = [].slice.call(document.querySelectorAll(".subtabs b"));
  var view = document.getElementById("view");
  tabs.forEach(function(t){
    t.onclick = function(){
      tabs.forEach(function(x){ x.className = ""; });
      t.className = "on";
      view.src = t.getAttribute("data-src") + "#view=FitH";
    };
  });
})();
</script>
</body></html>
